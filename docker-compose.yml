# Local development database:
#   docker compose up -d db
#
# Full self-hosted stack (app + db):
#   docker compose --profile app up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devmemo
      POSTGRES_PASSWORD: devmemo
      POSTGRES_DB: devmemo
    ports:
      - "5432:5432"
    volumes:
      - devmemo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmemo -d devmemo"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://devmemo:devmemo@db:5432/devmemo?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://devmemo:devmemo@db:5432/devmemo?schema=public
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  devmemo-pg:
